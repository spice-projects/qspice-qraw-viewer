name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      # run Qt in offscreen mode to avoid needing an X server
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install system dependencies
        # the PySide6 wheel still requires some native libraries such as EGL
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-glx libxkbcommon-x11-0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Upgrade pip and install tooling
        run: |
          python -m pip install --upgrade pip
          pip install build coverage

      - name: Install project
        run: |
          pip install .

      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover -p '*_test.py'
          coverage report -m
          coverage xml -o coverage.xml || true

      - name: Build distribution
        run: |
          python -m build
